name: Vendor anti-slop

on:
  push:
    branches:
      - feat/anti-slop-package

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout devtools
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone pinned anti-slop upstream
        run: |
          git clone https://github.com/dmmulroy/anti-slop.git /tmp/anti-slop
          git -C /tmp/anti-slop checkout e8c4880471b23ab7f216fba7b27d173a6ef07d4c
          test "$(git -C /tmp/anti-slop rev-parse HEAD)" = "e8c4880471b23ab7f216fba7b27d173a6ef07d4c"

      - name: Set up pnpm
        run: npm install --global pnpm@10.33.0

      - name: RED - prove tests fail without implementation
        run: |
          rm -rf packages/anti-slop
          mkdir -p packages/anti-slop/src/rules
          cp /tmp/anti-slop/package.json packages/anti-slop/package.json
          cp /tmp/anti-slop/tsconfig.json packages/anti-slop/tsconfig.json
          cp /tmp/anti-slop/pnpm-lock.yaml packages/anti-slop/pnpm-lock.yaml
          cp /tmp/anti-slop/src/rules/no-chained-type-assertions.test.ts packages/anti-slop/src/rules/
          cd packages/anti-slop
          pnpm install --frozen-lockfile
          set +e
          pnpm exec tsx src/rules/no-chained-type-assertions.test.ts > /tmp/anti-slop-red.log 2>&1
          status=$?
          set -e
          cat /tmp/anti-slop-red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected test to fail before rule implementation exists"
            exit 1
          fi
          grep -q "no-chained-type-assertions" /tmp/anti-slop-red.log

      - name: Vendor upstream package
        run: |
          rm -rf packages/anti-slop
          mkdir -p packages/anti-slop
          rsync -a --exclude='.git' --exclude='.github' /tmp/anti-slop/ packages/anti-slop/
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'packages/anti-slop/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.name = '@devtools/anti-slop';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          cat > packages/anti-slop/UPSTREAM.md <<'EOF'
          # Upstream provenance

          Vendored from [`dmmulroy/anti-slop`](https://github.com/dmmulroy/anti-slop).

          - Upstream version: `0.1.2`
          - Upstream commit: `e8c4880471b23ab7f216fba7b27d173a6ef07d4c`
          - Vendored on: `2026-09-01`

          The implementation, tests, installer skill, and MIT license are preserved from upstream. The local package name is `@devtools/anti-slop` so it fits the devtools package namespace.
          EOF
          python3 <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          bullet = '- [`packages/anti-slop`](packages/anti-slop) — Vendored anti-slop Oxlint rules for rejecting low-evidence TypeScript and JavaScript patterns.\n'
          if bullet not in text:
              marker = '- [`packages/devtools-memory`](packages/devtools-memory)'
              text = text.replace(marker, bullet + marker)
          path.write_text(text)
          PY

      - name: GREEN - run complete upstream validation
        working-directory: packages/anti-slop
        run: |
          pnpm install --frozen-lockfile
          pnpm check

      - name: Commit vendored package
        run: |
          rm .github/workflows/vendor-anti-slop.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md packages/anti-slop .github/workflows/vendor-anti-slop.yml
          git diff --cached --check
          git commit -m "feat: add anti-slop devtools package"
          git push origin HEAD:feat/anti-slop-package
